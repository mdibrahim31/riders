<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Distance & Delivery Charge Calculator</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { height: 350px; width: 100%; border-radius: 6px; margin-top: 10px; }
        .btn-container { margin-top: 10px; text-align: right; }
        #loc-btn { background: #ff385c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        #loc-btn:hover { background: #e00b32; }
        .info-box { margin-top: 10px; padding: 12px; background: #eef2f7; border-radius: 5px; font-size: 14px; }
        .map-link { display: inline-block; margin-top: 8px; color: #1a73e8; text-decoration: none; font-weight: bold; }
        .map-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h3>Delivery Charge Calculator</h3>
    <p style="font-size: 13px; color: #665;">Map-e click korun ba current location button use korun:</p>
    
    <div class="btn-container">
        <button id="loc-btn">📍 Use My Current Location</button>
    </div>

    <div id="map"></div>

    <div class="info-box" id="result">
        <p><strong>Route Distance:</strong> Calculating...</p>
        <p><strong>Delivery Charge:</strong> 0 BDT</p>
        <p><strong>Google Map Link:</strong> Not generated yet</p>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ==========================================
    // APNAR RESTAURANT ER LATITUDE & LONGITUDE EKANE DIN:
    // ==========================================
    const restaurantLat = 22.3569; // Ekhane apnar restaurant er lat boshaben
    const restaurantLng = 91.7832; // Ekhane apnar restaurant er lng boshaben

    // Map Initialize (Restaurant er location ke center kore map dekhabe)
    const map = L.map('map').setView([restaurantLat, restaurantLng], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Restaurant Marker
    L.marker([restaurantLat, restaurantLng]).addTo(map).bindPopup("<b>Our Restaurant</b>").openPopup();

    let customerMarker = null;
    let routeLine = null;

    // Map-e manually click korle
    map.on('click', function(e) {
        getRoadDistance(restaurantLat, restaurantLng, e.latlng.lat, e.latlng.lng);
    });

    // Current Location Button Click Korle
    document.getElementById('loc-btn').addEventListener('click', function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                getRoadDistance(restaurantLat, restaurantLng, lat, lng);
            }, function(error) {
                alert("Location access denied or not available!");
            });
        } else {
            alert("Geolocation is not supported by your browser");
        }
    });

    // OSRM API diye Real Road Distance & Route Line anar function
    function getRoadDistance(lat1, lon1, lat2, lon2) {
        if (customerMarker) {
            map.removeLayer(customerMarker);
        }
        if (routeLine) {
            map.removeLayer(routeLine);
        }

        customerMarker = L.marker([lat2, lon2]).addTo(map).bindPopup("<b>Delivery Location</b>").openPopup();

        // OSRM Free Routing API Endpoint
        const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.routes && data.routes.length > 0) {
                    const distanceInMeters = data.routes[0].distance; 
                    const distanceInKm = distanceInMeters / 1000;     
                    
                    const routeCoordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);

                    // Map-e rasta draw korar jonno polyline add kora
                    routeLine = L.polyline(routeCoordinates, {color: 'blue', weight: 4}).addTo(map);

                    // Delivery Charge Logic (Road distance onujayi)
                    let deliveryCharge = 0;
                    if (distanceInKm <= 2) {
                        deliveryCharge = 50;
                    } else if (distanceInKm <= 5) {
                        deliveryCharge = 80;
                    } else {
                        deliveryCharge = 80 + Math.ceil(distanceInKm - 5) * 15;
                    }

                    const googleMapUrl = `https://www.google.com/maps?q=${lat2},${lng2}`;

                    document.getElementById('result').innerHTML = `
                        <p><strong>Route Distance:</strong> ${distanceInKm.toFixed(2)} km (By Road)</p>
                        <p><strong>Delivery Charge:</strong> <strong>${deliveryCharge} BDT</strong></p>
                        <p><strong>Google Map Link:</strong> <br>
                           <a href="${googleMapUrl}" target="_blank" class="map-link">🔗 Open this location in Google Maps</a>
                        </p>
                    `;
                } else {
                    alert("Could not find a driving route to this location.");
                }
            })
            .catch(error => {
                console.error('Error fetching route:', error);
                alert("Failed to calculate route distance.");
            });
    }
</script>

</body>
</html>
