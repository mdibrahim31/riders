<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Charge Calculator with Google Map Link</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { height: 350px; width: 100%; border-radius: 6px; margin-top: 10px; }
        .btn-container { margin-top: 10px; text-align: right; }
        #loc-btn { background: #ff385c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        #loc-btn:hover { background: #e00b32; }
        .info-box { margin-top: 10px; padding: 12px; background: #eef2f7; border-radius: 5px; font-size: 14px; }
        .map-link { display: inline-block; margin-top: 8px; color: #1a73e8; text-decoration: none; font-weight: bold; }
        .map-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h3>Delivery Charge & Map Link Generator</h3>
    <p style="font-size: 13px; color: #665;">Map-e click korun ba current location button use korun:</p>
    
    <div class="btn-container">
        <button id="loc-btn">📍 Use My Current Location</button>
    </div>

    <div id="map"></div>

    <div class="info-box" id="result">
        <p><strong>Distance:</strong> 0 km</p>
        <p><strong>Delivery Charge:</strong> 0 BDT</p>
        <p><strong>Google Map Link:</strong> Not generated yet</p>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Restaurant er Fixed Coordinates (Udahoron: Chattogram)
    const restaurantLat = 22.3569;
    const restaurantLng = 91.7832;

    // Map Initialize
    const map = L.map('map').setView([restaurantLat, restaurantLng], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Restaurant Marker
    L.marker([restaurantLat, restaurantLng]).addTo(map).bindPopup("<b>Restaurant</b>");

    let customerMarker = null;

    // Map-e manually click korle
    map.on('click', function(e) {
        updateLocation(e.latlng.lat, e.latlng.lng);
    });

    // Current Location Button Click Korle
    document.getElementById('loc-btn').addEventListener('click', function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                updateLocation(lat, lng);
            }, function(error) {
                alert("Location access denied or not available!");
            });
        } else {
            alert("Geolocation is not supported by your browser");
        }
    });

    // Location update, distance calculation ebong Google Map link generate kora
    function updateLocation(lat, lng) {
        if (customerMarker) {
            map.removeLayer(customerMarker);
        }

        customerMarker = L.marker([lat, lng]).addTo(map).bindPopup("<b>Delivery Location</b>").openPopup();

        const distance = calculateDistance(restaurantLat, restaurantLng, lat, lng);
        
        // Delivery Charge Logic
        let deliveryCharge = 0;
        if (distance <= 2) {
            deliveryCharge = 50;
        } else if (distance <= 5) {
            deliveryCharge = 80;
        } else {
            deliveryCharge = 80 + Math.ceil(distance - 5) * 15;
        }

        // Google Map Direct Link Generate Kora
        const googleMapUrl = `https://www.google.com/maps?q=${lat},${lng}`;

        // Result screen e show kora
        document.getElementById('result').innerHTML = `
            <p><strong>Distance:</strong> ${distance.toFixed(2)} km</p>
            <p><strong>Delivery Charge:</strong> <strong>${deliveryCharge} BDT</strong></p>
            <p><strong>Google Map Link:</strong> <br>
               <a href="${googleMapUrl}" target="_blank" class="map-link">🔗 Open this location in Google Maps</a>
            </p>
        `;
    }

    // Haversine formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
        let R = 6371; 
        let dLat = deg2rad(lat2 - lat1);
        let dLon = deg2rad(lon2 - lon1);
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function deg2rad(deg) {
        return deg * (Math.PI/180);
    }
</script>

</body>
</html>
